    <main id="content" class="mat-notes-page">
      <h1 class="visually-hidden">Mat Notes</h1>
      <section class="movement-gallery" aria-label="Mat Notes">
        <section class="movement-section" aria-labelledby="takedown-heading">
          <h2 id="takedown-heading">Takedown</h2>
          <div class="movement-list movement-list--single">
            <figure class="movement-card">
              <div class="movement-visual"><img src="images/mat-notes-static/collar-sleeve-takedown-minimal-v2.webp" alt="Collar and sleeve takedown starting position"></div>
              <figcaption>Collar &amp; Sleeve Takedown</figcaption>
            </figure>
          </div>
        </section>

        <section class="movement-section" aria-labelledby="sweep-heading">
          <h2 id="sweep-heading">Sweep</h2>
          <div class="movement-list">
            <figure class="movement-card">
              <div class="movement-visual"><img src="images/mat-notes-static/scissor-sweep-minimal-v4.webp" alt="Scissor sweep position"></div>
              <figcaption>Scissor Sweep</figcaption>
            </figure>
            <figure class="movement-card">
              <div class="movement-visual"><img src="images/mat-notes-static/pendulum-sweep-minimal-v13.webp" alt="Pendulum sweep with a right-sleeve grip and foreground leg blocking outside the opponent"></div>
              <figcaption>Pendulum Sweep</figcaption>
            </figure>
          </div>
        </section>

        <section class="movement-section" aria-labelledby="submission-heading">
          <h2 id="submission-heading">Submission</h2>
          <div class="movement-list">
            <figure class="movement-card">
              <div class="movement-visual"><img src="images/mat-notes-static/cross-collar-choke-minimal-v3.webp" alt="Cross collar choke position"></div>
              <figcaption>Cross Collar Choke</figcaption>
            </figure>
            <figure class="movement-card">
              <div class="movement-visual"><img src="images/mat-notes-static/americana-minimal-v6.webp" alt="Americana figure-four grip from side control"></div>
              <figcaption>Americana</figcaption>
            </figure>
          </div>
